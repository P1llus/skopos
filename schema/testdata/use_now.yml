ir_version: "1"

# progress.use_now — advances cursor.last_timestamp to s.now() (optionally
# minus a per-iteration lookback) on every drain, without walking events.
# Useful for time-window APIs where the server doesn't echo a timestamp back
# but the cursor still needs to march forward in wall-clock time.
#
# {from_progress: latest_timestamp} resolves identically to
# latest_event_timestamp / max_event_field — RFC 3339 string from
# cursor.last_timestamp, empty on first drain.

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    api_key:
      type: secret
      default: "test-bearer-token-12345"

defaults:
  base_url: {ref: state.url}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    path: /api/v1/events
    query:
      since: {from_progress: latest_timestamp}

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  use_now:
    lookback: "5m"

error:
  mode: standard
