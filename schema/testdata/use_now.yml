# Clock-driven cursor: state.last_timestamp advances to now() minus a
# per-iteration lookback on every accepted page, without walking events.
# Useful for time-window APIs where the server doesn't echo a timestamp
# back but the cursor still needs to march forward in wall-clock time.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/api/v1/events"
    query:
      since: {ref: state.last_timestamp}

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {subtract: [{now: true}, "5m"]}

error:
  mode: standard
