# Exercises Value forms that no other fixture covers: base64, list,
# {subtract: [{now: true}, ...]}, literal_int, slice, and reducers
# (first/count) over a state-list ref.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  raw_marker:
    type: string
    default: "fingerprint:abc123"
  queue:
    type: string   # holds a list of pending item ids at runtime (worklist)

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/api/v1/events"
    headers:
      X-Marker: {base64: {ref: state.raw_marker}}
    query:
      since:  {format: rfc3339, value: {subtract: [{now: true}, "24h"]}}
      scopes: {list: ["audit", "security", "ingest"]}
      limit:  100   # YAML scalar → Value.LiteralInt (no discriminator key form)
      head:      {first: {ref: state.queue}}   # reducer over a state-list ref
      remaining: {count: {ref: state.queue}}   # emptiness test over a state-list ref

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  # Pop the queue head: a slice that drops index 0 (the worklist primitive).
  - to: state.queue
    from: {slice: {ref: state.queue, from: 1}}

error:
  mode: standard
