# Same conditional pattern as the etag_conditional template, but the
# conditional step is in the MIDDLE of a three-step chain rather than the
# last. Skip semantics apply identically: when the middle step's
# if-predicate is false or the step returns 304, {ref:
# steps.middle.body.<...>} resolves to a zero Value; the final step's
# url uses {present: ...} guarding to handle that.
#
# The final step is marked produces_events: true; the middle step's body
# is inspected only for the events path, never as the events source.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  etag_check:
    type: bool
    default: true

auth:
  none: {}

requests:
  - id: probe
    method: GET
    url: "${state.url}/api/v1/etag/probe"

  - id: middle
    method: GET
    url: "${state.url}/api/v1/etag/data"
    if:
      eq:
        path: state.etag_check
        value: true
    on_status:
      304: skip

  - id: events
    method: GET
    url:
      select:
        branches:
          - when: {present: steps.middle.body.next_path}
            value:
              concat:
                - {ref: state.url}
                - {ref: steps.middle.body.next_path}
        default: "${state.url}/api/v1/etag/fallback"
    produces_events: true

response:
  decode: json
  events_at: response.body.items

pagination:
  none: {}

progress: []

error:
  mode: standard
