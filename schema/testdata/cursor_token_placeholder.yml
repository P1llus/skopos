# cursor_token fixture pinning the empty-page progress shape.
#
# Progress fires once per accepted page-response, including empty pages
# (zero events). Server-provided cursors and ingestion timestamps can be
# persisted independently of event production: this fixture writes the
# server's reported next cursor into state.last_server_cursor on every
# accepted page.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  next_token:
    type: string
  last_server_cursor:
    type: string

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/api/v1/findings/keepalive"
    query:
      cursor: {ref: state.next_token, default: ""}
      limit:  "${state.page_size}"

response:
  decode: json
  events_at: response.body.findings

pagination:
  cursor_token:
    from: response.body.next_cursor
    to:   state.next_token

progress:
  - to: state.last_server_cursor
    from: {ref: response.body.next_cursor, default: ""}

error:
  mode: standard
