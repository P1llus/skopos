# Shares the auth × pagination × progress × decode tuple with
# dual_mode_url_gov.yml. The two fixtures intentionally differ only in
# state.gov_cloud (false vs true) so they exercise the select branches
# arm (gov) vs the default arm (commercial); don't drop either one
# without splitting that coverage somewhere else.
#
# This sibling pins the default arm: gov_cloud=false causes no branch to
# fire and the commercial endpoint applies.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  gov_cloud:
    type: bool
    default: false
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url:
      select:
        branches:
          - when: {eq: {path: state.gov_cloud, value: true}}
            value: "${state.url}/api/v1/events-gov"
        default: "${state.url}/api/v1/events-commercial"
    query:
      since: {ref: state.last_timestamp}

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.created_at}}]}

error:
  mode: standard
