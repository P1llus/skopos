# auth.oauth2.client_credentials with cache, multi-step with fan_out.
# Validator-surface fixture: exercises the OAuth2-cache + fan_out checks
# in schema/validate.go without involving the runner.
ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    token_url:
      type: url
      default: "http://localhost:9999/oauth2/token"
    client_id:
      type: string
      default: "test-client"
    client_secret:
      type: secret
      default: "test-secret"
    list_page_size:
      type: int
      default: 2
    batch_size:
      type: int
      default: 6

defaults:
  base_url: {ref: state.url}

# OAuth2 client_credentials with cached token + multi-step list → detail fan-out
# paginated by page number. The token is auto-refreshed when close to expiry.
# Each iteration: list incidents page → fan-out per incident to detail endpoint.
# Drain ends when size(merged events) < batch_size.
auth:
  oauth2:
    client_credentials:
      token_url: {ref: state.token_url}
      client_id: {ref: state.client_id}
      client_secret: {ref: state.client_secret}
      cache:
        store_in: token
        expiry_field: response.body.expires_in
        expiry_buffer: 60s

requests:
  - id: list
    method: GET
    path: /api/v1/incidents
    query:
      page: {format: string, value: {from_pagination: page}}
      limit: {format: string, value: {ref: state.list_page_size}}

  - id: detail
    method: GET
    path:
      concat:
        - /api/v1/incidents/
        - {ref: incident.id}
        - /details
    fan_out:
      over: {ref: steps.list.body.incidents}
      as: incident
      merge: flatten

response:
  decode: json
  events_at: ""

pagination:
  page_number:
    page_param: page
    batch_size: {ref: state.batch_size}

progress:
  stateless: {}

error:
  mode: standard
