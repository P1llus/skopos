# auth.oauth2.client_credentials with cache, multi-step with fan_out.
# Validator-surface fixture: exercises the OAuth2 cache + fan_out checks
# without involving the runner. Each iteration: list incidents page →
# fan-out per incident to detail endpoint. The counter pagination
# terminates by default when the page is shorter than state.batch_size.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  token_url:
    type: url
    default: "http://localhost:9999/oauth2/token"
  client_id:
    type: string
    default: "test-client"
  client_secret:
    type: secret
    default: "test-secret"
  list_page_size:
    type: int
    default: 2
  batch_size:
    type: int
    default: 6
  page:
    type: int

auth:
  oauth2:
    client_credentials:
      token_url:     {ref: state.token_url}
      client_id:     {ref: state.client_id}
      client_secret: {ref: state.client_secret}
      cache:
        to:         cache.access_token
        expires_at: {ref: response.body.expires_in, default: "1h"}
        buffer:     60s

requests:
  - id: list
    method: GET
    url: "${state.url}/api/v1/incidents"
    query:
      page:  "${state.page|1}"
      limit: "${state.list_page_size}"

  - id: detail
    method: GET
    url: "${state.url}/api/v1/incidents/${incident.id}/details"
    fan_out:
      over:  {ref: steps.list.body.incidents}
      as:    incident
      merge: flatten

response:
  decode: json
  events_at: ""

pagination:
  counter:
    to:    state.page
    start: 1
    step:  {ref: state.batch_size}

progress: []

error:
  mode: standard
