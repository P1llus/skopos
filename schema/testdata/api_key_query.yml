# API key sent as a query parameter (in_query: true). The auth block adds
# the key as a query parameter named by the header field; no
# Authorization header is emitted.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  api_key:
    type: secret
    default: "test-api-key-67890"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  api_key:
    header: apikey
    value: {ref: state.api_key}
    in_query: true

requests:
  - method: GET
    url: "${state.url}/v3/detections"
    query:
      created_after: {ref: state.last_timestamp}

response:
  decode: json
  events_at: response.body.resources

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.created_timestamp}}]}

error:
  mode: standard
