# fan_out per-item iteration. Validator-surface fixture: exercises the
# fan_out checks in schema/validate.go without involving the runner.
ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    api_key:
      type: secret
      default: "test-bearer-token-12345"

defaults:
  base_url: {ref: state.url}

auth:
  bearer:
    token: {ref: state.api_key}

# Two-step fan-out: list incidents, then fetch event details per incident.
# The list step returns incident summaries filtered by since.
# The detail step fans out over that list: one HTTP call per incident.
# Each per-incident response is a JSON list; merge: flatten concatenates them.
requests:
  - id: list
    method: GET
    path: /api/v1/incidents
    query:
      since: {from_progress: latest_timestamp}

  - id: detail
    method: GET
    path:
      concat:
        - /api/v1/incidents/
        - {ref: incident.id}
        - /details
    fan_out:
      over: {ref: steps.list.body.incidents}
      as: incident
      merge: flatten

response:
  decode: json
  events_at: ""

pagination:
  none: {}

progress:
  latest_event_timestamp:
    event_time:
      path: timestamp

error:
  mode: standard
