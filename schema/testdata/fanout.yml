# Two-step fan-out: list incidents, then fetch event details per
# incident. Validator-surface fixture: exercises the fan_out checks in
# schema/validate.go without involving the runner. The list step returns
# incident summaries filtered by since; the detail step fans out over
# that list (one HTTP call per incident). Each per-incident response is
# a JSON list; merge: flatten concatenates them.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - id: list
    method: GET
    url: "${state.url}/api/v1/incidents"
    query:
      since: {ref: state.last_timestamp}

  - id: detail
    method: GET
    url: "${state.url}/api/v1/incidents/${incident.id}/details"
    fan_out:
      over:  {ref: steps.list.body.incidents}
      as:    incident
      merge: flatten

response:
  decode: json
  events_at: ""

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
