# Multiple persistent state fields written by extract.to: state.*.
#
# Drives a worklist API where each iteration:
#   1. Reads the previous worklist top (state.next_partition_id) and
#      rolling-max timestamp (state.last_timestamp).
#   2. Calls /api/v1/segments?partition=<id>&since=<ts>.
#   3. Captures next_partition_id (server-supplied resume token) and
#      freeze_flag (a boolean) into persistent state fields via extract.
#   4. state.last_timestamp advances via the progress max-merge.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  next_partition_id:
    type: int
    default: 0
  freeze_flag:
    type: bool
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/api/v1/segments"
    query:
      partition: "${state.next_partition_id|0}"
      since:     {ref: state.last_timestamp}
    extract:
      - {to: state.next_partition_id, from: response.body.next_partition_id, coerce: int}
      # The body field is genuinely named "state". The response.body.<...>
      # root makes the body locator unambiguous regardless of the field
      # name underneath.
      - {to: state.freeze_flag, from: response.body.state.frozen, coerce: bool}

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
