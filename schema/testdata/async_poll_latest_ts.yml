# Async submit/poll/fetch fixture that pins the max-of-events progress
# write — state.last_timestamp advances to the max event timestamp seen
# in the fetch step's body. The chain shape is the canonical
# request-level loop (terminate_when on the poll step); the test fixture
# exists to anchor the progress write under the async pattern.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  export_id:
    type: string
  result_url:
    type: url
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - id: submit
    method: POST
    url: "${state.url}/api/v1/exports"
    body:
      json:
        since: {ref: state.last_timestamp}
    expect_status: [202]
    extract:
      - {to: state.export_id, from: response.body.export_id}

  - id: poll
    method: GET
    url: "${state.url}/api/v1/exports/${state.export_id}/status"
    terminate_when:
      and:
        - {present: response.body.status}
        - {eq: {path: response.body.status, value: complete}}
    extract:
      - {to: state.result_url, from: response.body.result_url}

  - id: fetch
    method: GET
    url: {ref: state.result_url}
    events_at: response.body.items

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
