# auth.oauth2.client_credentials with token caching + GraphQL Relay
# cursoring (expressed via pagination.cursor_token with an explicit
# terminate_when keyed on hasNextPage=false). GraphQL is encoded as
# body.json with a query string and a variables Object — there is no
# dedicated body.graphql variant.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  token_url:
    type: url
    default: "http://localhost:9999/oauth2/token"
  client_id:
    type: string
    default: "test-client"
  client_secret:
    type: secret
    default: "test-secret"
  after:
    type: string
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  oauth2:
    client_credentials:
      token_url:     {ref: state.token_url}
      client_id:     {ref: state.client_id}
      client_secret: {ref: state.client_secret}
      cache:
        to:         cache.access_token
        expires_at: {ref: response.body.expires_in, default: "1h"}
        buffer:     60s

requests:
  - method: POST
    url: "${state.url}/api/v1/graphql"
    body:
      json:
        query: |
          query Issues($after: String, $first: Int) {
            issues(after: $after, first: $first) {
              nodes { id created_at }
              pageInfo { hasNextPage endCursor }
            }
          }
        variables:
          object:
            after: {ref: state.after}
            first: {ref: state.page_size}

response:
  decode: json
  events_at: response.body.data.issues.nodes

pagination:
  cursor_token:
    from: response.body.data.issues.pageInfo.endCursor
    to:   state.after
    terminate_when:
      eq:
        path: response.body.data.issues.pageInfo.hasNextPage
        value: false

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.created_at}}]}

error:
  mode: standard
