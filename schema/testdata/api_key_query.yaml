ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    api_key:
      type: secret
      default: "test-api-key-67890"

defaults:
  base_url: {ref: state.url}

# API key sent as a query parameter (in_query: true).
# With in_query set, the auth block adds the key as a query param named by
# the header field; no Authorization header is emitted.
auth:
  api_key:
    header: apikey
    value: {ref: state.api_key}
    in_query: true

requests:
  - method: GET
    path: /v3/detections
    query:
      created_after: {from_progress: latest_timestamp}

response:
  decode: json
  events_at: resources

pagination:
  none: {}

progress:
  latest_event_timestamp:
    event_time:
      path: created_timestamp

error:
  mode: standard
