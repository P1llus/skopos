# Async submit/poll/fetch fixture that pins the stateless progress
# shape — every drain re-issues submit with no high-water mark
# persisted. Appropriate when the export is already idempotent at the
# server layer ("always re-fetch the last 24h").

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  export_id:
    type: string
  result_url:
    type: url

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - id: submit
    method: POST
    url: "${state.url}/api/v1/exports"
    expect_status: [202]
    extract:
      - {to: state.export_id, from: response.body.export_id}

  - id: poll
    method: GET
    url: "${state.url}/api/v1/exports/${state.export_id}/status"
    terminate_when:
      and:
        - {present: response.body.status}
        - {eq: {path: response.body.status, value: complete}}
    extract:
      - {to: state.result_url, from: response.body.result_url}

  - id: fetch
    method: GET
    url: {ref: state.result_url}
    events_at: response.body.items

pagination:
  none: {}

progress: []

error:
  mode: standard
