ir_version: "1"

# `on_status` verbs `empty_events` and `fail`. `skip` is covered by
# etag_conditional.yml.
#
# Realistic shape: an API that returns 429 with no Retry-After header (where
# the operator wants to treat the rate-limit as "no new data, try again next
# tick") and 502 (where the operator wants a loud failure that surfaces to
# the orchestrator).

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    api_key:
      type: secret
      default: "test-bearer-token-12345"

defaults:
  base_url: {ref: state.url}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    path: /api/v1/events
    on_status:
      429: empty_events
      502: fail

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  latest_event_timestamp:
    event_time:
      path: timestamp
    initial:
      lookback: "24h"

error:
  mode: standard
