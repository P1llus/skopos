# on_status verbs `empty_events` and `fail`. `skip` is covered by the
# etag_conditional template; `invalidate_cache` is covered by the
# token_cache fixtures.
#
# Realistic shape: an API that returns 429 with no Retry-After header
# (the operator treats the rate-limit as "no new data, try again next
# tick") and 502 (the operator wants a loud failure that surfaces to the
# orchestrator).

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "24h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/api/v1/events"
    on_status:
      429: empty_events
      502: fail

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
