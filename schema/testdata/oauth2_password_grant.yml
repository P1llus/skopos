# auth.oauth2.password_grant (RFC 6749 §4.3) with token caching into
# cache.access_token. The grant POSTs the username/password pair to the
# token endpoint and the captured access token is reused until now() +
# buffer >= expires_at.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  token_url:
    type: url
    default: "http://localhost:9999/oauth2/token"
  username:
    type: string
    default: "test-oauth2-user"
  password:
    type: secret
    default: "test-oauth2-password"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  oauth2:
    password_grant:
      token_url: {ref: state.token_url}
      username:  {ref: state.username}
      password:  {ref: state.password}
      cache:
        to:         cache.access_token
        expires_at: {ref: response.body.expires_in, default: "1h"}
        buffer:     60s

requests:
  - method: GET
    url: "${state.url}/api/v1/events"
    query:
      since: {ref: state.last_timestamp}
    events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
