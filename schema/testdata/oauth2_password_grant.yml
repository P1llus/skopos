# auth.oauth2.password_grant (RFC 6749 §4.3) with token caching.
ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    token_url:
      type: url
      default: "http://localhost:9999/oauth2/token"
    username:
      type: string
      default: "test-oauth2-user"
    password:
      type: secret
      default: "test-oauth2-password"

defaults:
  base_url: {ref: state.url}

# OAuth2 password grant (RFC 6749 §4.3). POST username/password to the
# token endpoint, parse the JSON response, and inject
# "Authorization: Bearer <access_token>" on every subsequent request. The
# token is cached at state.token (auto-registered); it is reused until
# within expiry_buffer of expiry_field.
auth:
  oauth2:
    password_grant:
      token_url: {ref: state.token_url}
      username: {ref: state.username}
      password: {ref: state.password}
      cache:
        store_in: token
        expiry_field: response.body.expires_in
        expiry_buffer: 60s

requests:
  - method: GET
    path: /api/v1/events
    query:
      since: {ref: cursor.last_timestamp}

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  latest_event_timestamp:
    event_time:
      path: timestamp

error:
  mode: standard
