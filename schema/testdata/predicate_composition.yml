# Exercises every non-eq/present Predicate verb: and / or / not / lt /
# lte / gt / gte / literal_bool. The fixture's cursor_token pagination
# terminates when the server reports complete=true OR (page_count >50 AND
# we are NOT in safe-mode).

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  safe_mode:
    type: bool
    default: false
  scroll_id:
    type: string

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/api/v1/scroll"
    if:
      and:
        - literal_bool: true              # always-on; demonstrates the constant predicate primitive
        - not: {eq: {path: state.safe_mode, value: true}}
        - present: state.api_key
    query:
      scroll: {ref: state.scroll_id}

response:
  decode: json
  events_at: response.body.events

pagination:
  cursor_token:
    from: response.body.meta.next_scroll
    to:   state.scroll_id
    terminate_when:
      or:
        - {eq: {path: response.body.meta.complete, value: true}}
        - and:
            - {gt:  {path: response.body.meta.page_count,  value: 50}}
            - {lte: {path: response.body.meta.page_count,  value: 1000}}
            - {gte: {path: response.body.meta.page_count,  value: 50}}
            - {lt:  {path: response.body.meta.error_count, value: 1}}
            - not: {eq: {path: state.safe_mode, value: true}}

progress: []

error:
  mode: standard
