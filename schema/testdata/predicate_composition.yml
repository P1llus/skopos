ir_version: "1"

# Exercises non-`eq`/`present` predicate verbs: and / or / not / lt / lte /
# gt / gte / literal_bool. The fixture's scroll_id pagination terminates when
# the server reports complete=true OR (page_count exceeded 50 AND we are
# NOT in safe-mode).

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    api_key:
      type: secret
      default: "test-bearer-token-12345"
    safe_mode:
      type: bool
      default: false

defaults:
  base_url: {ref: state.url}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    path: /api/v1/scroll
    if:
      and:
        - literal_bool: true              # always-on; demonstrates the constant predicate primitive
        - not:
            eq:
              path: state.safe_mode
              value: true
        - present: state.api_key
    query:
      scroll: {ref: cursor.scroll_id}

response:
  decode: json
  events_at: response.body.events

pagination:
  scroll_id:
    scroll_id_at: response.body.meta.next_scroll
    complete_when:
      or:
        - eq:
            path: response.body.meta.complete
            value: true
        - and:
            - gt:
                path: response.body.meta.page_count
                value: 50
            - lte:
                path: response.body.meta.page_count
                value: 1000
            - gte:
                path: response.body.meta.page_count
                value: 50
            - lt:
                path: response.body.meta.error_count
                value: 1
            - not:
                eq:
                  path: state.safe_mode
                  value: true

progress:
  stateless: {}

error:
  mode: standard
