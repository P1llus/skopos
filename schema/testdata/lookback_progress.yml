# Per-iteration lookback on the events high-water mark.
#
# Models the "advance to the max event timestamp, then back off N seconds"
# pattern. The first-run window is the default on state.last_timestamp
# (24h lookback). Every subsequent iteration takes the max-over-events
# value, subtracts 30s to guard against clock skew and late-arriving
# events, and persists the result.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-token"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "24h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/api/v1/events"
    query:
      since: {ref: state.last_timestamp}
    events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from:
      subtract:
        - {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}
        - "30s"

error:
  mode: standard
