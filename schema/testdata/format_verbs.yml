# Exercises every format verb in the closed set: url_encode,
# parse_duration, string, int, bool, rfc3339, rfc3339nano, unix_seconds,
# unix_millis, duration.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  tag_filter:
    type: string
    default: "warning level"
  lookback:
    type: duration
    default: "24h"
  page_size:
    type: int
    default: 100
  include_archived:
    type: bool
    default: false
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "24h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/api/v1/events"
    query:
      tag:         {format: url_encode,     value: {ref: state.tag_filter}}
      since_ns:    {format: parse_duration, value: {ref: state.lookback}}
      label:       {format: string,         value: {ref: state.tag_filter}}
      size:        {format: int,            value: {ref: state.page_size}}
      archived:    {format: bool,           value: {ref: state.include_archived}}
      since_rfc:   {format: rfc3339,        value: {ref: state.last_timestamp}}
      since_secs:  {format: unix_seconds,   value: {ref: state.last_timestamp}}
      since_ms:    {format: unix_millis,    value: {ref: state.last_timestamp}}
      window:      {format: duration,       value: {ref: state.lookback}}

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
