# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# multi_mode_auth — runtime auth selection via predicates.
#
# Branches are evaluated in declaration order; the first match wins and
# the `default` arm fires when no branch matches (including when the
# dispatch field is unset). Nested `multi_mode` is rejected at validation
# time, so each branch must select a sibling auth variant. The default
# arm is a bare Auth value (same shape as branches[].auth).

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-api-key-67890"
  auth_mode:
    type: enum
    values: [bearer, api_key]
    default: "api_key"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  multi_mode:
    branches:
      - when: {eq: {path: state.auth_mode, value: bearer}}
        auth:
          bearer:
            token: {ref: state.api_key}
      - when: {eq: {path: state.auth_mode, value: api_key}}
        auth:
          api_key:
            header: X-API-Key
            value: {ref: state.api_key}
    default:
      custom:
        header: X-Fallback-Auth
        value: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/multi_mode_auth/events"
    query:
      since: {ref: state.last_timestamp}
    events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.created_at}}]}

error:
  mode: standard
