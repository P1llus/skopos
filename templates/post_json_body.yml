# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# post_json_body — POST with a JSON body carrying a time-window query.
#
# Demonstrates: requests[].body.json with a sliding [window_start,
# window_end) window written by progress:, plus offset-style counter
# pagination within the window. The body reads the persistent window
# from state.window_start / state.window_end and the per-drain offset
# from state.search_from; the upper bound is computed inline as
# search_from + page_size.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  window_start:
    type: timestamp
    format: rfc3339nano
  window_end:
    type: timestamp
    format: rfc3339nano
  search_from:
    type: int

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: POST
    url: "${state.url}/post_json_body/search"
    body:
      json:
        from_date:   {ref: state.window_start}
        to_date:     {ref: state.window_end}
        search_from: {ref: state.search_from, default: 0}
        search_to:   {add: [{ref: state.search_from, default: 0}, {ref: state.page_size}]}
    events_at: response.body.data.alerts

pagination:
  counter:
    to:    state.search_from
    start: 0
    step:  {ref: state.page_size}

progress:
  - to: state.window_start
    from: {ref: state.window_end, default: {subtract: [{now: true}, "720h"]}}
  - to: state.window_end
    from: {now: true}

error:
  mode: standard
