# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# cursor_token — opaque cursor token pagination.
#
# Demonstrates: pagination.cursor_token. The server returns a cursor in the
# response body; the next request echoes it back via {ref: state.next_token}.
# Default termination fires when the source path resolves to absent.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  next_token:
    type: string
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/cursor_token/findings"
    query:
      # Bootstrap iteration: state.next_token is unset → default "" reaches
      # the wire as cursor= so the server starts a fresh cursor session.
      # Subsequent iterations send the captured cursor token.
      cursor: {ref: state.next_token, default: ""}
      limit: "${state.page_size}"

response:
  decode: json
  events_at: response.body.findings

pagination:
  cursor_token:
    from: response.body.next_cursor
    to:   state.next_token

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.created_at}}]}

error:
  mode: standard
