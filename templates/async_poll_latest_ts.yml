# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# async_poll_latest_ts — async submit/poll/fetch with a max-of-events
# high-water mark.
#
# Sibling of async_poll.yml: the submit/poll/fetch chain is identical; the
# only difference is progress, which advances state.last_timestamp to the
# maximum event timestamp seen in the fetch step's body. Appropriate when
# the fetch payload carries event timestamps and the operator wants
# exactly-once semantics anchored to the data.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  export_id:
    type: string
  result_url:
    type: url
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - id: submit
    method: POST
    url: "${state.url}/async_poll_latest_ts/exports"
    body:
      json:
        since: {ref: state.last_timestamp}
    expect_status: [202]
    extract:
      - {to: state.export_id, from: response.body.export_id}

  - id: poll
    method: GET
    url: "${state.url}/async_poll_latest_ts/exports/${state.export_id}/status"
    terminate_when:
      and:
        - {present: response.body.status}
        - {eq: {path: response.body.status, value: complete}}
    extract:
      - {to: state.result_url, from: response.body.result_url}

  - id: fetch
    method: GET
    url: {ref: state.result_url}
    produces_events: true

response:
  decode: json
  events_at: response.body.items

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
