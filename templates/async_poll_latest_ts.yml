# async_poll_latest_ts — async submit/poll/fetch with timestamp-driven cursor.
#
# Sibling of async_poll.yml: same submit → poll → fetch chain, but the
# on_complete cursor_update is kind=latest_event_timestamp — the cursor
# advances to the max event timestamp seen in the fetch step's body instead
# of using_now. Appropriate for async APIs whose fetch payload carries event
# timestamps and the operator wants exactly-once semantics anchored to the
# data.

ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    api_key:
      type: secret
      default: "test-bearer-token-12345"

defaults:
  base_url: {ref: state.url}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - id: submit
    method: POST
    path: /async_poll_latest_ts/exports
    body:
      json:
        # default: "" preserves the historical wire shape on the first drain
        # — without it, an absent cursor.last_timestamp would JSON-encode as
        # null instead of the empty string the latest_event_timestamp branch
        # sends on the bootstrap iteration.
        since: {ref: cursor.last_timestamp, default: ""}
    expect_status: [202]

  - id: poll
    method: GET
    path:
      concat:
        - /async_poll_latest_ts/exports/
        - {ref: cursor.export_id}
        - /status

  - id: fetch
    method: GET
    url: {ref: cursor.result_url}

response:
  decode: json
  events_at: response.body.items

pagination:
  none: {}

progress:
  async_job:
    submit:
      step: submit
      extract:
        export_id: {from: response.body.export_id}
    poll:
      step: poll
      complete_when:
        eq:
          path: response.body.status
          value: complete
      extract:
        result_url: {from: response.body.result_url}
    fetch:
      step: fetch
    on_complete:
      cursor_update:
        kind: latest_event_timestamp
        event_time:
          path: timestamp

error:
  mode: standard
