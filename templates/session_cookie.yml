# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# session_cookie — session cookie auth via a login request.
#
# Two-step chain. The login step extracts Set-Cookie into
# extract.session_cookie (per-iteration scratch); the data step rides it
# as the Cookie header. The chain runs end-to-end every iteration so
# server-rotated session cookies are handled.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"

auth:
  none: {}

requests:
  - id: login
    method: POST
    url: "${state.url}/session_cookie/login"
    extract:
      - {to: extract.session_cookie, from: response.header.Set-Cookie}

  - id: data
    method: GET
    url: "${state.url}/session_cookie/data"
    headers:
      Cookie: {ref: extract.session_cookie}
    events_at: response.body.items

pagination:
  none: {}

progress: []

error:
  mode: standard
