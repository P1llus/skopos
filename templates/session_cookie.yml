# session_cookie — session cookie auth via a login request.
#
# Demonstrates: a login request whose Set-Cookie is captured into the
# cursor, then replayed as the Cookie header on subsequent requests until
# the session expires.

ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5

defaults:
  base_url: {ref: state.url}

auth:
  none: {}

# Two-step session-cookie chain.
# Step 1 (login): POST /session_cookie/login; extract Set-Cookie response header into extract.session_cookie.
# Step 2 (data):  GET /session_cookie/data with the extracted cookie as the Cookie request header.
#
# The chain runs end-to-end every iteration so server-rotated session cookies are handled.
requests:
  - id: login
    method: POST
    path: /session_cookie/login
    extract:
      - name: session_cookie
        source: header
        header: Set-Cookie

  - id: data
    method: GET
    path: /session_cookie/data
    headers:
      Cookie: {ref: extract.session_cookie}

response:
  decode: json
  events_at: response.body.items

pagination:
  none: {}

progress:
  stateless: {}

error:
  mode: standard
