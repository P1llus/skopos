# next_url_in_body — server returns the next URL in the response body.
#
# Demonstrates: pagination.next_url with the URL pulled from the body
# (e.g. {"next": "https://api/.../?page=2"}). The runner follows the URL
# until the field is absent.

ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    api_key:
      type: secret
      default: "test-bearer-token-12345"

defaults:
  base_url: {ref: state.url}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    path: /next_url_in_body/alerts
    query:
      since: {from_progress: latest_timestamp}
      limit: {format: string, value: {ref: state.page_size}}

response:
  decode: json
  events_at: alerts

# The response body carries a fully-formed URL for the next page. When absent
# (null or "") the drain completes.
pagination:
  next_url_in_body:
    next_url_at: meta.next_page

progress:
  latest_event_timestamp:
    event_time:
      path: created_at

error:
  mode: standard
