# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# next_url_in_body — server returns the next URL in the response body.
#
# Demonstrates: pagination.next_url reading meta.next_page from the body
# (e.g. {"meta": {"next_page": "https://api/.../?page=2"}}). The request's
# url slot reads state.next_url back with a bootstrap fallback that fires
# on the very first iteration.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  next_url:
    type: url
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    # First iteration: state.next_url is unset, so the default builds the
    # bootstrap URL. Subsequent iterations follow the absolute URL the
    # server returned at meta.next_page in the previous response.
    url: {ref: state.next_url, default: "${state.url}/next_url_in_body/alerts"}
    query:
      since: {ref: state.last_timestamp}
      limit: "${state.page_size}"

response:
  decode: json
  events_at: response.body.alerts

pagination:
  next_url:
    from: response.body.meta.next_page
    to:   state.next_url

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.created_at}}]}

error:
  mode: standard
