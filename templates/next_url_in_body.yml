# next_url_in_body — server returns the next URL in the response body.
#
# Demonstrates: pagination.next_url_in_body with the URL pulled from the
# body (e.g. {"meta": {"next_page": "https://api/.../?page=2"}}). The
# runner parses next_url_at into cursor.next_url, and the request's url
# slot reads it back via {ref: cursor.next_url, default: <bootstrap-url>}
# — first iteration hits the bootstrap URL, every subsequent iteration
# follows whatever the previous page named, until the field is absent
# (null or ""). Wiring cursor.next_url into the request is the template's
# job.

ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    api_key:
      type: secret
      default: "test-bearer-token-12345"

defaults:
  base_url: {ref: state.url}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    # First iteration: cursor.next_url is unset, so the default builds the
    # bootstrap URL. Subsequent iterations follow the absolute URL the server
    # returned at meta.next_page in the previous response.
    url:
      ref: cursor.next_url
      default:
        concat:
          - {ref: state.url}
          - /next_url_in_body/alerts
    query:
      since: {ref: cursor.last_timestamp}
      limit: {format: string, value: {ref: state.page_size}}

response:
  decode: json
  events_at: response.body.alerts

# The response body carries a fully-formed URL for the next page. When absent
# (null or "") the drain completes.
pagination:
  next_url_in_body:
    next_url_at: response.body.meta.next_page

progress:
  latest_event_timestamp:
    event_time:
      path: created_at

error:
  mode: standard
