# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# offset_pagination — offset/limit pagination via the counter variant.
#
# Demonstrates: pagination.counter with start: 0 and step: {ref:
# state.page_size}. Default short-page termination — when the page returns
# fewer events than state.page_size, the loop ends. For APIs that take
# both a start and an exclusive-end index, the `end` field is computed
# from state.offset + state.page_size.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  offset:
    type: int

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/offset/findings"
    expect_status: [200, 204]
    query:
      offset: "${state.offset|0}"
      limit:  "${state.page_size}"
      end:    {add: [{ref: state.offset, default: 0}, {ref: state.page_size}]}

response:
  decode: json
  events_at: response.body.items

pagination:
  counter:
    to:    state.offset
    start: 0
    step:  {ref: state.page_size}

progress: []

error:
  mode: standard
