# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# custom_auth — single custom auth header.
#
# Demonstrates: auth.custom for APIs that don't fit one of the named auth
# variants. The header value is built from a state ref; richer compositions
# are expressed with `{concat: [...]}` or string interpolation.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "custom-auth-value-99999"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  custom:
    header: X-Custom-Auth
    value: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/custom_auth/events"
    query:
      since: {ref: state.last_timestamp}
    events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
