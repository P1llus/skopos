# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# page_number — page-number pagination via the counter variant.
#
# Demonstrates: pagination.counter with start: 1, step: 1. Termination is
# driven by the server's has_next flag rather than the default short-page
# detection.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  page:
    type: int
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/page_number/findings"
    query:
      since:     {ref: state.last_timestamp}
      page:      "${state.page|1}"
      page_size: "${state.page_size}"
    events_at: response.body.data

pagination:
  counter:
    to:    state.page
    start: 1
    step:  1
    terminate_when:
      not: {present: response.body.meta.has_next}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
