# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# zip_csv_response — a ZIP archive of CSV files.
#
# Demonstrates: a two-stage chain over a multi-member archive. The zip stage
# expands the archive; glob "*.csv" selects only the CSV members (skipping a
# README); each member is decoded by the downstream csv terminal. Members are
# decoded in name-sorted order and their rows concatenated into one event
# stream. events_at must be empty for csv.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"

auth:
  none: {}

requests:
  - method: GET
    url: "${state.url}/zip_csv/archive"
    decode:
      - zip:
          glob: "*.csv"
      - csv:
          header: present
    events_at: ""

pagination:
  none: {}

progress: []

error:
  mode: standard
