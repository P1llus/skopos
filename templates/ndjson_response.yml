# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# ndjson_response — newline-delimited JSON response decode.
#
# Demonstrates: response.decode=ndjson. Each non-empty line is one event;
# events_at "" with ndjson decode means the body root IS the events list.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/ndjson_response/logs"

response:
  decode: ndjson
  events_at: ""

pagination:
  none: {}

progress: []

error:
  mode: standard
