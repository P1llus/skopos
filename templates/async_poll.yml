# async_poll — asynchronous job pattern.
#
# Demonstrates: requests[].kind=async_job, complete_when predicate for
# polling until the job is ready, progress.use_now (clock-driven cursor)
# so the next drain runs against a fresh time window.

ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    api_key:
      type: secret
      default: "test-bearer-token-12345"

defaults:
  base_url: {ref: state.url}

auth:
  bearer:
    token: {ref: state.api_key}

# Async-poll (submit → poll → fetch).
#
# Iteration model driven by cursor.phase (default: "submit"):
#   phase=submit → POST /async_poll/exports (expect 202)
#                  Extract body.export_id → cursor.export_id
#                  Advance phase to "poll"
#   phase=poll   → GET /async_poll/exports/{cursor.export_id}/status
#                  Loop until body.status == "complete"
#                  Extract body.result_url → cursor.result_url
#                  Advance phase to "fetch"
#   phase=fetch  → GET cursor.result_url
#                  Decode body.items as events
#                  Set cursor.last_timestamp = now; want_more=false
requests:
  - id: submit
    method: POST
    path: /async_poll/exports
    body:
      json:
        since: {from_progress: latest_timestamp}
    expect_status: [202]

  - id: poll
    method: GET
    path:
      concat:
        - /async_poll/exports/
        - {ref: cursor.export_id}
        - /status

  - id: fetch
    method: GET
    url: {ref: cursor.result_url}

response:
  decode: json
  events_at: response.body.items

pagination:
  none: {}

progress:
  async_job:
    submit:
      step: submit
      extract:
        export_id: {from: response.body.export_id}
    poll:
      step: poll
      complete_when:
        eq:
          path: response.body.status
          equal: complete
      extract:
        result_url: {from: response.body.result_url}
    fetch:
      step: fetch
    on_complete:
      cursor_update:
        kind: use_now

error:
  mode: standard
