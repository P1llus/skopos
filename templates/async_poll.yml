# async_poll — asynchronous job pattern (submit / poll / fetch).
#
# Three plain request steps with terminate_when: on the poll step. The
# poll loop reads response.body.status until it equals "complete"; then
# control passes to the fetch step. state.last_timestamp advances to
# {now: true} after the fetch step's events emit so the next drain runs
# against a fresh time window.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  export_id:
    type: string
  result_url:
    type: url
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - id: submit
    method: POST
    url: "${state.url}/async_poll/exports"
    body:
      json:
        since: {ref: state.last_timestamp}
    expect_status: [202]
    extract:
      - {to: state.export_id, from: response.body.export_id}

  - id: poll
    method: GET
    url: "${state.url}/async_poll/exports/${state.export_id}/status"
    terminate_when:
      and:
        - {present: response.body.status}
        - {eq: {path: response.body.status, value: complete}}
    extract:
      - {to: state.result_url, from: response.body.result_url}

  - id: fetch
    method: GET
    url: {ref: state.result_url}
    produces_events: true

response:
  decode: json
  events_at: response.body.items

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {now: true}

error:
  mode: standard
