# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# etag_conditional — conditional GET driven by an ETag.
#
# Demonstrates: state.etag captured via extract, ridden as If-None-Match
# on the next iteration, on_status: {304: skip} so a 304 response counts
# as an accepted page (progress fires, no events emit) and state.etag
# survives across drains.
#
# The probe step is unconditional; it exists to make the chain genuinely
# multi-step. The data step carries both conditional primitives:
#
#   if:          gated by state.etag_check (default: true).
#   on_status:   304 → skip (canonical "Not Modified" handling).

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  etag_check:
    type: bool
    default: true
  etag:
    type: string
  page:
    type: int
  last_seen_at:
    type: timestamp

auth:
  none: {}

requests:
  - id: probe
    method: GET
    url: "${state.url}/etag_conditional/probe"

  - id: data
    method: GET
    url: "${state.url}/etag_conditional/data"
    query:
      page: "${state.page|1}"
    headers:
      If-None-Match: {ref: state.etag, default: ""}
    if:
      eq:
        path: state.etag_check
        value: true
    extract:
      - {to: state.etag, from: response.header.ETag}
    on_status:
      304: skip
    events_at: response.body.items

pagination:
  counter:
    to: state.page
    start: 1
    step: 1
    terminate_when:
      not: {present: response.body.meta.has_next}

progress:
  - to: state.last_seen_at
    from: {now: true}

error:
  mode: standard
