# oauth2_relay — OAuth2 client_credentials + GraphQL Relay pagination.
#
# Demonstrates: auth.oauth2.client_credentials with token caching combined
# with pagination.graphql_relay. The runner POSTs the GraphQL query with
# variables.after driven by the previous response's pageInfo.endCursor;
# pagination terminates on hasNextPage=false. GraphQL has no dedicated
# body.graphql variant — body.json with a query+variables object is the
# canonical encoding.
ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 2
    token_url:
      type: url
      default: "http://localhost:9999/oauth2_relay/token"
    client_id:
      type: string
      default: "test-client"
    client_secret:
      type: secret
      default: "test-secret"

defaults:
  base_url: {ref: state.url}

# OAuth2 client_credentials with cached token. Same shape as
# oauth2_client_credentials, but the cached token rides POST GraphQL
# requests rather than GET data requests.
auth:
  oauth2:
    client_credentials:
      token_url: {ref: state.token_url}
      client_id: {ref: state.client_id}
      client_secret: {ref: state.client_secret}
      cache:
        store_in: token
        expiry_field: response.body.expires_in
        expiry_buffer: 60s

requests:
  - method: POST
    path: /oauth2_relay/graphql
    body:
      json:
        query: |
          query Issues($after: String, $first: Int) {
            issues(after: $after, first: $first) {
              nodes { id created_at }
              pageInfo { hasNextPage endCursor }
            }
          }
        variables:
          object:
            after: {from_pagination: relay_cursor}
            first: {ref: state.page_size}

response:
  decode: json
  events_at: response.body.data.issues.nodes

pagination:
  graphql_relay:
    has_next_page_at: response.body.data.issues.pageInfo.hasNextPage
    end_cursor_at: response.body.data.issues.pageInfo.endCursor
    cursor_var: after

progress:
  latest_event_timestamp:
    event_time:
      path: created_at

error:
  mode: standard
