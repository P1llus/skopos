# etag_conditional_middle — conditional middle step in a 3-step chain.
#
# Sibling of etag_conditional.yml. Same conditional primitives (if +
# on_status: {304: skip}) but the conditional step sits in the MIDDLE of
# the chain rather than at the end. The final step is the events
# producer; its url is a select Value that consumes steps.middle's body
# when the middle step ran, and falls through to a fallback path when the
# middle step was skipped (either by if=false or by a 304 response).
#
# state.etag_check defaults to true so the middle step runs and returns
# {"next_path": "/etag_conditional_middle/events"}; the final step picks
# that path via the present-guarded select branch. Override
# state.etag_check=false to exercise the fallback arm.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  etag_check:
    type: bool
    default: true

auth:
  none: {}

requests:
  - id: probe
    method: GET
    url: "${state.url}/etag_conditional_middle/probe"

  - id: middle
    method: GET
    url: "${state.url}/etag_conditional_middle/data"
    if:
      eq:
        path: state.etag_check
        value: true
    on_status:
      304: skip

  - id: events
    method: GET
    url:
      select:
        branches:
          - when: {present: steps.middle.body.next_path}
            value:
              concat:
                - {ref: state.url}
                - {ref: steps.middle.body.next_path}
        default: "${state.url}/etag_conditional_middle/fallback"
    produces_events: true

response:
  decode: json
  events_at: response.body.items

pagination:
  none: {}

progress: []

error:
  mode: standard
