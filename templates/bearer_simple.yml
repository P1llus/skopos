# bearer_simple — the canonical starting-point example.
#
# Demonstrates: auth.bearer, a single GET request, pagination.none, a
# max-over-events high-water mark progress write. state.last_timestamp
# advances to the maximum event timestamp every drain.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/bearer_simple/events"
    query:
      since: {ref: state.last_timestamp}
      limit: "${state.page_size}"

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
