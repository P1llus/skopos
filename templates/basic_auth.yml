# basic_auth — HTTP Basic auth (username + password).
#
# Demonstrates: auth.basic, single GET, pagination.none,
# progress.latest_event_timestamp.

ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    username:
      type: string
      default: "testuser"
    password:
      type: secret
      default: "testpass"

defaults:
  base_url: {ref: state.url}

auth:
  basic:
    username: {ref: state.username}
    password: {ref: state.password}

requests:
  - method: GET
    path: /basic_auth/data

response:
  decode: json
  events_at: items

pagination:
  none: {}

progress:
  stateless: {}

error:
  mode: standard
