# basic_auth — HTTP Basic auth (username + password).
#
# Demonstrates: auth.basic, single GET, pagination.none, no progress
# tracking (every drain pulls the full dataset).

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  username:
    type: string
    default: "testuser"
  password:
    type: secret
    default: "testpass"

auth:
  basic:
    username: {ref: state.username}
    password: {ref: state.password}

requests:
  - method: GET
    url: "${state.url}/basic_auth/data"

response:
  decode: json
  events_at: response.body.items

pagination:
  none: {}

progress: []

error:
  mode: standard
