# oauth2_client_credentials — RFC 6749 client-credentials grant with token caching.
#
# The runner POSTs to token_url, caches the access token at state.token,
# and rides it as Authorization: Bearer on every subsequent request. The
# cached token is reused until within expiry_buffer of expires_in.
ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    token_url:
      type: url
      default: "http://localhost:9999/oauth2/token"
    client_id:
      type: string
      default: "test-client"
    client_secret:
      type: secret
      default: "test-secret"

defaults:
  base_url: {ref: state.url}

# OAuth2 client_credentials flow. The framework POSTs to token_url with
# HTTP Basic client_id:client_secret, parses the JSON response, and injects
# "Authorization: Bearer <access_token>" on every subsequent request.
# The token is cached under state.token (auto-registered); it is reused
# until within expiry_buffer of expiry_field.
auth:
  oauth2:
    client_credentials:
      token_url: {ref: state.token_url}
      client_id: {ref: state.client_id}
      client_secret: {ref: state.client_secret}
      cache:
        store_in: token
        expiry_field: response.body.expires_in
        expiry_buffer: 60s

requests:
  - method: GET
    path: /oauth2/findings
    query:
      # Bootstrap iteration: cursor.token is unset → default "" reaches the
      # wire as cursor= so the server starts a fresh cursor session.
      # Subsequent iterations send the captured cursor token.
      cursor: {ref: cursor.token, default: ""}

response:
  decode: json
  events_at: response.body.findings

pagination:
  cursor_token:
    token_at: response.body.next_cursor

progress:
  latest_event_timestamp:
    event_time:
      path: timestamp

error:
  mode: standard
