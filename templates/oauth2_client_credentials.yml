# oauth2_client_credentials — RFC 6749 client-credentials grant with token
# caching.
#
# The runner POSTs grant_type=client_credentials to token_url, writes the
# access token into cache.access_token via the unified Cache block, and
# rides it as Authorization: Bearer on every subsequent request. The
# cached token is reused until now() + buffer >= expires_at.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  token_url:
    type: url
    default: "http://localhost:9999/oauth2/token"
  client_id:
    type: string
    default: "test-client"
  client_secret:
    type: secret
    default: "test-secret"
  next_token:
    type: string
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  oauth2:
    client_credentials:
      token_url:     {ref: state.token_url}
      client_id:     {ref: state.client_id}
      client_secret: {ref: state.client_secret}
      cache:
        to:         cache.access_token
        expires_at: {ref: response.body.expires_in, default: "1h"}
        buffer:     60s

requests:
  - method: GET
    url: "${state.url}/oauth2/findings"
    query:
      # Bootstrap iteration: state.next_token is unset → default "" reaches
      # the wire as cursor= so the server starts a fresh cursor session.
      cursor: {ref: state.next_token, default: ""}

response:
  decode: json
  events_at: response.body.findings

pagination:
  cursor_token:
    from: response.body.next_cursor
    to:   state.next_token

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
