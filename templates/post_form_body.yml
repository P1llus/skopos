# post_form_body — POST with application/x-www-form-urlencoded body.
#
# Demonstrates: requests[].body.form. Three fields exercise the form
# variant: a state ref (timestamp filter), an int formatted to string,
# and a static string literal.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: POST
    url: "${state.url}/post_form_body/events"
    body:
      form:
        since:  {ref: state.last_timestamp}
        limit:  "${state.page_size}"
        format: json

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
