# post_form_body — POST with application/x-www-form-urlencoded body.
#
# Demonstrates: requests[].body.form. Form fields reference state /
# cursor / progress like any other Value expression; the runner sets the
# Content-Type header automatically.

ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    api_key:
      type: secret
      default: "test-bearer-token-12345"

defaults:
  base_url: {ref: state.url}

auth:
  bearer:
    token: {ref: state.api_key}

# POST with application/x-www-form-urlencoded body. Three fields exercise
# body.form on the main request: a from_progress value (timestamp filter),
# a state-derived integer formatted to string, and a static literal.
requests:
  - method: POST
    path: /post_form_body/events
    body:
      form:
        since: {from_progress: latest_timestamp}
        limit: {format: string, value: {ref: state.page_size}}
        format: json

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  latest_event_timestamp:
    event_time:
      path: timestamp

error:
  mode: standard
