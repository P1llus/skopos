# post_raw_body — body.raw for APIs whose request body isn't JSON or
# form-encoded.
#
# The runner sends the evaluated string verbatim with no Content-Type
# header (the operator sets one via headers: if required). Typical uses:
# NDJSON ingest endpoints, GraphQL-via-text/plain, hand-tuned XML
# payloads. This fixture posts an NDJSON-shaped line built with string
# interpolation.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  tenant_id:
    type: string
    default: "tenant-42"

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: POST
    url: "${state.url}/post_raw_body/ingest"
    headers:
      Content-Type: application/x-ndjson
    body:
      raw: '{"tenant":"${state.tenant_id}","event":"hello"}'

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress: []

error:
  mode: standard
