# simple_get_object — the smallest end-to-end spec.
#
# Demonstrates: one GET, no auth, no pagination, no progress. The runner
# decodes the JSON response and emits the body as a single event (a JSON
# object at the root wraps to a one-element list).

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"

auth:
  none: {}

requests:
  - method: GET
    url: "${state.url}/simple_get_object/status"

# When the body is a single JSON object (not an array) the runner wraps it
# in a one-element list, so one event is emitted per iteration.
response:
  decode: json
  events_at: ""

pagination:
  none: {}

progress: []

error:
  mode: standard
