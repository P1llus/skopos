# oauth2_password_grant — RFC 6749 §4.3 password grant with token caching.
#
# The runner POSTs username/password to token_url, caches the issued bearer
# at state.token, and rides it as Authorization: Bearer on every subsequent
# request. The cached token is reused until within expiry_buffer of
# expires_in. Same caching machinery as oauth2_client_credentials; the only
# difference is the grant body.
ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    token_url:
      type: url
      default: "http://localhost:9999/oauth2_password_grant/token"
    username:
      type: string
      default: "test-oauth2-user"
    password:
      type: secret
      default: "test-oauth2-password"

defaults:
  base_url: {ref: state.url}

# OAuth2 password grant (RFC 6749 §4.3). The framework POSTs to token_url
# with form-urlencoded grant_type=password&username=...&password=..., parses
# the JSON response, and injects "Authorization: Bearer <access_token>" on
# every subsequent request. The token is cached under state.token
# (auto-registered); it is reused until within expiry_buffer of expiry_field.
auth:
  oauth2:
    password_grant:
      token_url: {ref: state.token_url}
      username: {ref: state.username}
      password: {ref: state.password}
      cache:
        store_in: token
        expiry_field: expires_in
        expiry_buffer: 60s

requests:
  - method: GET
    path: /oauth2_password_grant/events
    query:
      since: {from_progress: latest_timestamp}

response:
  decode: json
  events_at: events

pagination:
  none: {}

progress:
  latest_event_timestamp:
    event_time:
      path: timestamp

error:
  mode: standard
