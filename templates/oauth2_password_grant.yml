# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# oauth2_password_grant — RFC 6749 §4.3 password grant with token caching.
#
# The runner POSTs grant_type=password&username=...&password=... to
# token_url, writes the access token into cache.access_token via the
# unified Cache block, and rides it as Authorization: Bearer on every
# subsequent request. Same caching machinery as
# oauth2_client_credentials; only the grant body differs.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  token_url:
    type: url
    default: "http://localhost:9999/oauth2_password_grant/token"
  username:
    type: string
    default: "test-oauth2-user"
  password:
    type: secret
    default: "test-oauth2-password"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  oauth2:
    password_grant:
      token_url: {ref: state.token_url}
      username:  {ref: state.username}
      password:  {ref: state.password}
      cache:
        to:         cache.access_token
        expires_at: {ref: response.body.expires_in, default: "1h"}
        buffer:     60s

requests:
  - method: GET
    url: "${state.url}/oauth2_password_grant/events"
    query:
      since: {ref: state.last_timestamp}
    events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
