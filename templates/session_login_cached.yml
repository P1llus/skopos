# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# session_login_cached — custom JSON login with a step-level token cache.
#
# A POST /login step wrapped in requests[].cache pays the round-trip once
# and reuses the captured response body until the cache nears expiry. The
# events step rides the cached token as Bearer auth. This is the
# non-OAuth2 counterpart of auth.oauth2.<grant>.cache — for vendors whose
# login does not fit the OAuth2 client_credentials shape.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  username:
    type: string
    default: "admin"
  password:
    type: secret
    default: "test-password"
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

# Bearer auth reads the token field from the cache.session_token slot.
# The default keeps auth resolution from failing on the very first drain
# (before the slot is populated) — the login endpoint ignores the
# Authorization header.
auth:
  bearer:
    token: {ref: cache.session_token.token, default: "pending"}

requests:
  # Step 1 (login): POST the credentials. requests[].cache captures the
  # decoded body into cache.session_token and re-runs the step when the
  # remaining lifetime falls below buffer.
  - id: login
    method: POST
    url: "${state.url}/session_login_cached/login"
    body:
      json:
        username: {ref: state.username}
        password: {ref: state.password}
    cache:
      to:         cache.session_token
      expires_at: {ref: response.body.expires_in, default: "1h"}
      buffer:     60s

  - id: events
    method: GET
    url: "${state.url}/session_login_cached/events"
    produces_events: true

response:
  decode: json
  events_at: response.body.events

pagination:
  none: {}

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.timestamp}}]}

error:
  mode: standard
