# session_login_cached — custom JSON login with a per-step token cache.
#
# Demonstrates: a POST /login step wrapped in requests[].cache so the login
# round-trip is paid once and then SKIPPED on later iterations and drains
# until the cached token nears expiry. The events step rides the cached
# token as Bearer auth. This is the non-OAuth2 counterpart of
# auth.oauth2.<grant>.cache — for vendors whose login does not fit the
# OAuth2 client_credentials shape (custom JSON logins, session-key
# exchanges, etc.).

ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    username:
      type: string
      default: "admin"
    password:
      type: secret
      default: "test-password"

defaults:
  base_url: {ref: state.url}

# Bearer auth rides the cached token slot (state.session_token), which is
# auto-registered as a runtime field by the cache: block on the login step.
# The default keeps the login request itself (auth is applied to every
# request) from failing on the first drain before the slot is populated;
# the login endpoint ignores the Authorization header.
auth:
  bearer:
    token: {ref: state.session_token, default: "pending"}

requests:
  # Step 1 (login): POST /session_login_cached/login. The cache: block
  # captures the response's session_token field into state.session_token and
  # pairs it with an expiry stamp at cursor.__step_session_token_expires_at.
  # On the next iteration/drain the step is skipped while the token is still
  # inside its expiry_buffer.
  - id: login
    method: POST
    path: /session_login_cached/login
    body:
      json:
        username: {ref: state.username}
        password: {ref: state.password}
    cache:
      store_in: session_token
      expiry_field: expires_in
      expiry_buffer: 60s
      expiry_format: duration

  # Step 2 (events): GET /session_login_cached/events, riding the cached
  # Bearer token.
  - id: events
    method: GET
    path: /session_login_cached/events
    produces_events: true

response:
  decode: json
  events_at: events

pagination:
  none: {}

progress:
  latest_event_timestamp:
    event_time:
      path: timestamp

error:
  mode: standard
