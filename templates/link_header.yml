# link_header — RFC 5988 Link-header pagination.
#
# Demonstrates: pagination.link_header. Each response carries a
# `Link: <next-url>; rel="next"` header; the runner parses it into
# cursor.next_link, and the request's url slot reads it back via
# {ref: cursor.next_link, default: <bootstrap-url>} — so the first
# iteration hits the bootstrap URL and every subsequent iteration follows
# the server's link until it disappears. link_header has no send_as
# auto-injection: wiring cursor.next_link into the request is the
# template's job.

ir_version: "1"

state:
  fields:
    url:
      type: url
      default: "http://localhost:9999"
    initial_interval:
      type: duration
      default: "720h"
    page_size:
      type: int
      default: 5
    api_key:
      type: secret
      default: "test-api-key-67890"

defaults:
  base_url: {ref: state.url}

auth:
  api_key:
    header: X-API-Key
    value: {ref: state.api_key}

requests:
  - method: GET
    # First iteration: cursor.next_link is unset, so the default builds the
    # bootstrap URL. Subsequent iterations follow the absolute URL the server
    # advertised in the previous response's Link header.
    url:
      ref: cursor.next_link
      default:
        concat:
          - {ref: state.url}
          - /link_header/incidents
    query:
      updated_after: {ref: cursor.last_timestamp}
      per_page: {format: string, value: {ref: state.page_size}}

response:
  decode: json
  events_at: response.body.incidents

# Follows the RFC 5988 Link: <url>; rel="next" response header. When a
# next-link is absent the drain completes. The default regex pattern is
# applied; override with pagination.link_header.pattern for non-standard forms.
pagination:
  link_header: {}

progress:
  latest_event_timestamp:
    event_time:
      path: updated_at

error:
  mode: standard
