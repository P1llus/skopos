# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# link_header — RFC 5988 Link-header pagination.
#
# Demonstrates: pagination.next_url with regex / capture parsing the
# Link: <url>; rel="next" header. The runner peels the URL out of the
# header value and writes it to state.next_url; the request's url slot
# reads it back with a bootstrap default for the very first iteration.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  api_key:
    type: secret
    default: "test-api-key-67890"
  next_url:
    type: url
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  api_key:
    header: X-API-Key
    value: {ref: state.api_key}

requests:
  - method: GET
    # First iteration: state.next_url is unset, so the default builds the
    # bootstrap URL. Subsequent iterations follow the absolute URL the
    # server advertised in the previous response's Link header.
    url: {ref: state.next_url, default: "${state.url}/link_header/incidents"}
    query:
      updated_after: {ref: state.last_timestamp}
      per_page: "${state.page_size}"

response:
  decode: json
  events_at: response.body.incidents

pagination:
  next_url:
    from:    response.header.link
    to:      state.next_url
    regex:   '<(.*?)>;\s*rel="next"'
    capture: 1

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.updated_at}}]}

error:
  mode: standard
