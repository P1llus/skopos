# yaml-language-server: $schema=https://raw.githubusercontent.com/p1llus/skopos/main/docs/schema/v1/skopos.schema.json
# scroll_id — scroll-and-keep-alive paginated API.
#
# Demonstrates: pagination.cursor_token used as a scroll session. The first
# request opens a scroll; subsequent requests echo the scroll id until the
# server reports complete=true via the explicit terminate_when predicate.

ir_version: "1"

state:
  url:
    type: url
    default: "http://localhost:9999"
  page_size:
    type: int
    default: 5
  api_key:
    type: secret
    default: "test-bearer-token-12345"
  scroll_id:
    type: string
  last_timestamp:
    type: timestamp
    default: {subtract: [{now: true}, "720h"]}

auth:
  bearer:
    token: {ref: state.api_key}

requests:
  - method: GET
    url: "${state.url}/scroll_id/scroll"
    query:
      since: {ref: state.last_timestamp}
      # Bootstrap iteration: state.scroll_id is unset → the slot is omitted
      # (no default) so the server opens a fresh scroll session. Subsequent
      # iterations send the captured scroll id.
      scroll: {ref: state.scroll_id}
    events_at: response.body.events

pagination:
  cursor_token:
    from: response.body.request_metadata.scroll
    to:   state.scroll_id
    terminate_when:
      eq:
        path: response.body.request_metadata.complete
        value: "true"

progress:
  - to: state.last_timestamp
    from: {max: [{ref: state.last_timestamp}, {max: {ref: events.*.created_at}}]}

error:
  mode: standard
