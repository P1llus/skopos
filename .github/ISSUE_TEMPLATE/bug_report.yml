name: Bug report
description: Something Skopos did wrong or stopped doing right.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug, prefer also to include go version and OS/arch when relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skopos version
      description: Output of `skopos --version`, or the git commit if built from source.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: |
        Smallest spec / Go snippet that reproduces the bug. If a YAML spec
        is involved, paste the spec (redact secrets) plus the command used
        to run it.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: |
        Include error messages, exit code, and the relevant slice of stdout /
        stderr events. Use `--trace` (or the equivalent embedded Tracer) if
        the bug is request-level.
      render: shell
    validations:
      required: true
