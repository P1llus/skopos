name: Feature request
description: Request schema support for a new API or a Client/CLI feature..
labels: [enhancement]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Schema (new field or validation)
        - Runner behaviour (new request / pagination / auth variant)
        - Embedding API (client / store / sink / tracer surface)
        - CLI
        - Docs only
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Current Limitation
      description: |
        Describe the API you are unable to use with the schema today, preferrably with links to examples or documentation.
        If you are proposing a new feature describe shortly what you are unable to do today or workarounds applied.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Feature
      description: |
        A detailed description about your preferred way of utilizing the new feature and your expected outcome(s) in different scenarios.
      render: yaml
